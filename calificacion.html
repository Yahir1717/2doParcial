<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso o no paso?</title>
</head>
<body>

<script>
    let cal1 = parseFloat(prompt("Ingresa la primera calificación:"));
    let cal2 = parseFloat(prompt("Ingresa la segunda calificación:"));
    let cal3 = parseFloat(prompt("Ingresa la tercera calificación:"));

    let promedio = (cal1 + cal2 + cal3) / 3;

    alert("El promedio del alumno es: " + promedio.toFixed(2));

    if (promedio >= 6) {
        alert("Aprobaste :D");
    } else {
        alert("Reprobastes chamaco >:v");
    }
</script>
    
    <a href="index.html">index</a>
</body>
</html>
