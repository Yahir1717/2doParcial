<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>OPERACIONES BASICAS</h1> 

      <script>
        let n1=Number(prompt('intorudce el primer numero'))
        let n2=Number(prompt('Introduce el segundo numero'))

        suma =n1+n2;
        resta = n1-n2;
        multi = n1*n2;
        divi = n1/n2;
        document.write('el valor es de la suma es: '+ suma);
        document.write(' el valor de la resta es: '+ resta);
        document.write(' el valor de la multiplicacion es: '+ multi);
        document.write(' el valor de la division es: '+ divi);

        
    </script>
</body>
</html>
